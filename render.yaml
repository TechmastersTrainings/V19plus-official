# ============================================================
# Render Blueprint — V19plus Production Infrastructure
# Region: Singapore (Locked Primary Region)
# Connect this repo in Render Dashboard → New → Blueprint
# ============================================================

version: "1"

databases:
  - name: v19plus-postgres
    databaseName: v19plus_db
    user: v19plus_admin
    region: singapore
    plan: starter
    postgresMajorVersion: "16"
    ipAllowList: [] # Only allow internal network & secure administrative access

services:
  # ------------------------------------------------------------
  # 1. FastAPI Modular Monolith API (Singapore)
  # ------------------------------------------------------------
  - type: web
    name: v19plus-api
    runtime: docker
    dockerfilePath: apps/backend/Dockerfile
    dockerContext: apps/backend
    region: singapore
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: v19plus-postgres
          property: connectionString
      - key: REDIS_URL
        # In Render, Key-Value internal connection string or redis service
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # Cloudflare R2 Credentials (S3 Compatible)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_MASTERS_BUCKET
        value: v19plus-masters
      - key: R2_STREAMING_BUCKET
        value: v19plus-streaming
      - key: CDN_STREAMING_BASE_URL
        value: https://stream.v19plus.com
      - key: PLAYBACK_TOKEN_SECRET
        generateValue: true
      # Razorpay Payment Gateway (Server-Side Verified)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Observability
      - key: SENTRY_DSN
        sync: false
      - key: POSTHOG_API_KEY
        sync: false
      # Allowed Origins (CORS)
      - key: ALLOWED_ORIGINS
        value: "https://v19plus.com,https://admin.v19plus.com,https://v19plus-web.vercel.app,http://localhost:3000,http://localhost:3001,capacitor://localhost"

  # ------------------------------------------------------------
  # 2. Render Video Transcoding Worker (FFmpeg + ARQ in Singapore)
  # ------------------------------------------------------------
  - type: worker
    name: v19plus-video-worker
    runtime: docker
    dockerfilePath: apps/video-worker/Dockerfile
    dockerContext: apps/video-worker
    region: singapore
    plan: standard # Scalable independently from web API (CPU/RAM priority)
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: v19plus-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_MASTERS_BUCKET
        value: v19plus-masters
      - key: R2_STREAMING_BUCKET
        value: v19plus-streaming
      - key: SENTRY_DSN
        sync: false
      - key: WORKER_CONCURRENCY
        value: "2"
